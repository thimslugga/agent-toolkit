name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Skip if commit message contains [skip ci]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate Plugin Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate marketplace.json
        run: |
          echo "Validating marketplace.json..."
          cat .claude-plugin/marketplace.json | jq .

          # Check required fields
          jq -e '.name' .claude-plugin/marketplace.json > /dev/null
          jq -e '.owner' .claude-plugin/marketplace.json > /dev/null
          jq -e '.plugins' .claude-plugin/marketplace.json > /dev/null
          jq -e '.metadata.version' .claude-plugin/marketplace.json > /dev/null

          echo "✓ marketplace.json is valid"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate dist/ is up to date
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/build_plugins.py
          if ! git diff --quiet dist/ .claude-plugin/marketplace.json; then
            echo "ERROR: dist/ is out of date. Run 'python3 scripts/build_plugins.py' and commit."
            git diff --stat dist/ .claude-plugin/marketplace.json
            exit 1
          fi
          echo "✓ dist/ is up to date"


  naming-analyzer:
    name: naming-analyzer scanner (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.13']
    defaults:
      run:
        working-directory: skills/naming-analyzer
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Lint and format
        if: matrix.python == '3.13'
        run: |
          uvx ruff check .
          uvx ruff format --check .

      - name: Type check
        if: matrix.python == '3.13'
        run: uv run --no-project --with mypy --with pytest mypy scripts/naming-scan.py tests

      - name: Test with coverage
        run: uv run --no-project --with pytest --with pytest-cov pytest --cov=scripts --cov-report=term-missing

      - name: Dogfood on this repository
        run: python scripts/naming-scan.py ../../scripts ../ --min-severity major --format text
